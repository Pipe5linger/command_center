  function startDrag(e) {     // Don't start drag on form elements     if (isFormElement(e.target)) return;          isDragging = true;     $menu.classList.add('dragging');          const rect = $menu.getBoundingClientRect();     dragOffset.x = e.clientX - rect.left - rect.width / 2;     dragOffset.y = e.clientY - rect.top - rect.height / 2;          e.preventDefault();   }

  function startDragTouch(e) {     if (isFormElement(e.target)) return;          isDragging = true;     $menu.classList.add('dragging');          const touch = e.touches[0];     const rect = $menu.getBoundingClientRect();     dragOffset.x = touch.clientX - rect.left - rect.width / 2;     dragOffset.y = touch.clientY - rect.top - rect.height / 2;          e.preventDefault();   }

  function drag(e) {     if (!isDragging) return;          const x = e.clientX - dragOffset.x;     const y = e.clientY - dragOffset.y;          // Keep form within viewport bounds     const rect = $menu.getBoundingClientRect();     const maxX = window.innerWidth - rect.width / 2;     const maxY = window.innerHeight - rect.height / 2;     const minX = rect.width / 2;     const minY = rect.height / 2;          const clampedX = Math.max(minX, Math.min(maxX, x));     const clampedY = Math.max(minY, Math.min(maxY, y));          $menu.style.left = clampedX + 'px';     $menu.style.top = clampedY + 'px';     $menu.style.transform = 'translate(-50%, -50%)';   }

  function dragTouch(e) {     if (!isDragging) return;          const touch = e.touches[0];     const x = touch.clientX - dragOffset.x;     const y = touch.clientY - dragOffset.y;          const rect = $menu.getBoundingClientRect();     const maxX = window.innerWidth - rect.width / 2;     const maxY = window.innerHeight - rect.height / 2;     const minX = rect.width / 2;     const minY = rect.height / 2;          const clampedX = Math.max(minX, Math.min(maxX, x));     const clampedY = Math.max(minY, Math.min(maxY, y));          $menu.style.left = clampedX + 'px';     $menu.style.top = clampedY + 'px';     $menu.style.transform = 'translate(-50%, -50%)';          e.preventDefault();   }

  function endDrag() {     if (!isDragging) return;          isDragging = false;     $menu.classList.remove('dragging');   }

  function isFormElement(element) {     const formTags = ['INPUT', 'BUTTON', 'LABEL', 'A'];     const formClasses = ['checkbox-group', 'sign-in-link'];          return formTags.includes(element.tagName) ||            formClasses.some(cls => element.classList.contains(cls) || element.closest(`.${cls}`));   }

  // Click anywhere to open (except on sliders and drag actions)   document.addEventListener("click", (event) => {     if (isDragging) return;          const $target = event.target;     const isMenu = $menu.contains($target);     const isSlider = $target.matches('input[type="range"]') || $target.closest('.social-icon') || $target.closest('footer');

    if (!isMenu && !isSlider) {       $menu.classList.add('open');       clearTimeout(cleanTimer);     } else if (isMenu && !isFormElement($target)) {       event.stopPropagation();     }   });

  // Close form with Escape key   document.addEventListener('keydown', (event) => {     if (event.key === 'Escape' && $menu.classList.contains('open')) {       $menu.classList.remove('open');       cleanTimer = setTimeout(() => {         const form = $menu.querySelector('form');         if (form) form.reset();         // Reset position         $menu.style.left = '50%';         $menu.style.top = '50%';         $menu.style.transform = 'translate(-50%, -50%)';       }, 200);     }   });

  // Handle form submission   $menu.querySelector('form').addEventListener('submit', (event) => {     event.preventDefault();          const password = document.getElementById('password').value;     const confirmPassword = document.getElementById('confirmPassword').value;          if (password !== confirmPassword) {       alert('Passwords do not match!');       return;     }          // Simulate successful signup     alert('Account created successfully!');     $menu.classList.remove('open');          cleanTimer = setTimeout(() => {       event.target.reset();       // Reset position       $menu.style.left = '50%';       $menu.style.top = '50%';       $menu.style.transform = 'translate(-50%, -50%)';     }, 200);   });

  // Hue sliders live-update   $hue1.addEventListener('input', (e) => {     requestAnimationFrame(() => {       document.body.style.setProperty('--hue1', e.target.value);       if ($menu.classList.contains('open')) {         $menu.classList.add('open'); // Retrigger glow animation       }     });   });   $hue2.addEventListener('input', (e) => {     requestAnimationFrame(() => {       document.body.style.setProperty('--hue2', e.target.value);       if ($menu.classList.contains('open')) {         $menu.classList.add('open'); // Retrigger glow animation       }     });   });

  // Initialize drag functionality   initDrag();

  // Random pleasant starting hues   const rand1 = 120 + Math.floor(Math.random() * 240);   const rand2 = rand1 - 80 + (Math.floor(Math.random() * 60) - 30);   $hue1.value = rand1; $hue2.value = rand2;   document.body.style.setProperty('--hue1', rand1);   document.body.style.setProperty('--hue2', rand2); </script>

</body></html>
