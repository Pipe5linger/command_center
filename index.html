<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanctuary Command Center Launcher</title>
    <style>
        body {
            background: #060810;
            color: #2DD4BF;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid rgba(45, 212, 191, 0.2);
            padding: 30px;
            border-radius: 12px;
            background: rgba(10, 12, 20, 0.8);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.1);
        }
        a {
            color: #A855F7;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sanctuary Command Center</h1>
        <p>The interactive dashboard is served dynamically by the Flask backend.</p>
        <p>Access the live dashboard here: <a href="http://localhost:9999">http://localhost:9999</a></p>
    </div>
</body>
</html>
